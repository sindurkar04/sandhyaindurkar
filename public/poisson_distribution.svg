<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Poisson Distribution</text>
  <rect x="120" y="100" width="560" height="280" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="2"/>
  <line x1="140" y1="360" x2="660" y2="360" stroke="#9ca3af" stroke-width="2"/>
  <rect x="150" y="250" width="34" height="110" rx="3" fill="#0d9488" opacity="0.85"/>
  <rect x="190" y="180" width="34" height="180" rx="3" fill="#0d9488" opacity="0.85"/>
  <rect x="230" y="150" width="34" height="210" rx="3" fill="#7c3aed" opacity="0.9"/>
  <rect x="270" y="170" width="34" height="190" rx="3" fill="#0d9488" opacity="0.85"/>
  <rect x="310" y="220" width="34" height="140" rx="3" fill="#0d9488" opacity="0.85"/>
  <rect x="350" y="270" width="34" height="90" rx="3" fill="#0d9488" opacity="0.85"/>
  <rect x="390" y="305" width="34" height="55" rx="3" fill="#0d9488" opacity="0.85"/>
  <rect x="430" y="325" width="34" height="35" rx="3" fill="#0d9488" opacity="0.85"/>
  <rect x="470" y="340" width="34" height="20" rx="3" fill="#0d9488" opacity="0.85"/>
  <rect x="510" y="348" width="34" height="12" rx="3" fill="#0d9488" opacity="0.85"/>
  <line x1="264" y1="120" x2="264" y2="360" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="264" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ea580c">lambda</text>
  <text x="400" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#374151">Number of events (k)</text>
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#111111">P(X = k) = lambda^k e^(-lambda) / k!</text>
</svg>

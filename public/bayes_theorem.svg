<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f5"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Bayes Theorem</text>
  <rect x="100" y="120" width="120" height="200" rx="8" fill="#e11d48" opacity="0.85"/>
  <rect x="260" y="80" width="120" height="240" rx="8" fill="#0d9488" opacity="0.85"/>
  <rect x="420" y="160" width="120" height="160" rx="8" fill="#2563eb" opacity="0.85"/>
  <text x="160" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e11d48">Prior</text>
  <text x="320" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0d9488">Likelihood</text>
  <text x="480" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Posterior</text>
  <text x="400" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111111">P(A|B) = P(B|A) P(A) / P(B)</text>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#6b7280">Update belief when new evidence arrives</text>
</svg>

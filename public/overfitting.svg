<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f5"/>
  <rect x="80" y="60" width="640" height="380" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#111111">Train vs Holdout</text>
  <polyline points="120,320 180,280 240,300 300,260 360,270 420,230 480,240 540,200 600,210 660,180" fill="none" stroke="#111111" stroke-width="3"/>
  <circle cx="120" cy="320" r="5" fill="#111111"/><circle cx="300" cy="260" r="5" fill="#111111"/><circle cx="480" cy="240" r="5" fill="#111111"/><circle cx="660" cy="180" r="5" fill="#111111"/>

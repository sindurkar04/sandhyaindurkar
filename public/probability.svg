<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f1eb"/>
  <rect x="100" y="70" width="600" height="360" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Probability</text>
  <rect x="160" y="140" width="480" height="48" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="400" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111111">17 wins / 40 trials = 42.5%</text>
  <rect x="200" y="220" width="120" height="140" rx="6" fill="#d1d5db"/>
  <rect x="340" y="260" width="120" height="100" rx="6" fill="#111111"/>
  <rect x="480" y="240" width="120" height="120" rx="6" fill="#6b7280"/>
  <text x="260" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">n = 40</text>
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">n = 200</text>
  <text x="540" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">n = 2000</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#6b7280">Same rate, different certainty</text>
</svg>

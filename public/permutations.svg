<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f5"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Permutations</text>
  <rect x="180" y="140" width="70" height="70" rx="10" fill="#2563eb"/>
  <rect x="270" y="120" width="70" height="90" rx="10" fill="#0d9488"/>
  <rect x="360" y="150" width="70" height="60" rx="10" fill="#ea580c"/>
  <rect x="450" y="130" width="70" height="80" rx="10" fill="#8b5cf6"/>
  <text x="215" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">1</text>
  <text x="305" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">2</text>
  <text x="395" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">3</text>
  <text x="485" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">4</text>
  <text x="400" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#6b7280">Ordered slots: position matters</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111111">P(n,r) = n! / (n - r)!</text>
</svg>

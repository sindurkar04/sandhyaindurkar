<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Binomial Distribution</text>
  <rect x="120" y="100" width="560" height="280" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="2"/>
  <line x1="140" y1="360" x2="660" y2="360" stroke="#9ca3af" stroke-width="2"/>
  <rect x="160" y="336" width="36" height="24" rx="3" fill="#2563eb" opacity="0.85"/>
  <rect x="204" y="300" width="36" height="60" rx="3" fill="#2563eb" opacity="0.85"/>
  <rect x="248" y="240" width="36" height="120" rx="3" fill="#2563eb" opacity="0.85"/>
  <rect x="292" y="170" width="36" height="190" rx="3" fill="#7c3aed" opacity="0.9"/>
  <rect x="336" y="150" width="36" height="210" rx="3" fill="#7c3aed" opacity="0.9"/>
  <rect x="380" y="170" width="36" height="190" rx="3" fill="#7c3aed" opacity="0.9"/>
  <rect x="424" y="240" width="36" height="120" rx="3" fill="#2563eb" opacity="0.85"/>
  <rect x="468" y="300" width="36" height="60" rx="3" fill="#2563eb" opacity="0.85"/>
  <rect x="512" y="336" width="36" height="24" rx="3" fill="#2563eb" opacity="0.85"/>
  <line x1="372" y1="120" x2="372" y2="360" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="372" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ea580c">mean = n p</text>
  <text x="400" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#374151">Number of successes (k)</text>
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#111111">P(X = k) = C(n,k) p^k (1 - p)^(n - k)</text>
</svg>

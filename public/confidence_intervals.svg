<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f5"/>
  <rect x="100" y="70" width="600" height="360" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Confidence Intervals</text>
  <rect x="220" y="200" width="360" height="48" rx="4" fill="#ebe6de" stroke="#d1d5db"/>
  <rect x="300" y="200" width="200" height="48" rx="4" fill="#d1d5db"/>
  <rect x="360" y="200" width="80" height="48" rx="4" fill="#111111"/>
  <line x1="400" x2="400" y1="180" y2="268" stroke="#111111" stroke-width="2"/>
  <text x="400" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111111">4.2%</text>
  <text x="260" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">low</text>
  <text x="540" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">high</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#6b7280">95% range around the estimate</text>

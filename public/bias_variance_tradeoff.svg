<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Bias vs Variance</text>
  <line x1="100" y1="380" x2="700" y2="380" stroke="#9ca3af" stroke-width="2"/>
  <line x1="100" y1="380" x2="100" y2="100" stroke="#9ca3af" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#374151">Model complexity</text>
  <text x="56" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#374151" transform="rotate(-90 56 250)">Error</text>
  <path d="M 120 320 Q 280 140 380 200 T 680 340" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M 120 200 Q 400 220 680 100" stroke="#ea580c" stroke-width="3" fill="none"/>
  <path d="M 120 280 Q 320 180 400 210 T 680 260" stroke="#8b5cf6" stroke-width="3" fill="none"/>
  <path d="M 120 300 Q 500 120 680 80" stroke="#0d9488" stroke-width="2.5" fill="none"/>
  <path d="M 120 260 Q 380 200 420 210 T 680 300" stroke="#e11d48" stroke-width="2.5" fill="none"/>
  <circle cx="420" cy="210" r="8" fill="#8b5cf6" stroke="#111111" stroke-width="2"/>
  <text x="440" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111111">sweet spot</text>
  <text x="140" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563eb">bias^2</text>
  <text x="600" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ea580c">variance</text>
  <text x="620" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b5cf6">total</text>
  <text x="620" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0d9488">train</text>
  <text x="620" y="310" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e11d48">test</text>
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#111111">Expected error = bias^2 + variance + noise</text>
</svg>

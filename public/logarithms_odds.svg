<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Logarithms and Odds</text>
  <rect x="80" y="90" width="300" height="280" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="230" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ea580c">odds = p / (1 - p)</text>
  <line x1="110" y1="340" x2="350" y2="340" stroke="#9ca3af" stroke-width="2"/>
  <line x1="110" y1="340" x2="110" y2="160" stroke="#9ca3af" stroke-width="2"/>
  <path d="M 120 330 Q 200 300 280 200 T 340 170" stroke="#ea580c" stroke-width="3" fill="none"/>
  <text x="230" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#374151">p (0 to 1)</text>
  <rect x="420" y="90" width="300" height="280" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="570" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0d9488">log-odds = log(odds)</text>
  <line x1="450" y1="340" x2="690" y2="340" stroke="#9ca3af" stroke-width="2"/>
  <line x1="450" y1="340" x2="450" y2="160" stroke="#9ca3af" stroke-width="2"/>
  <line x1="450" y1="250" x2="690" y2="250" stroke="#d1d5db" stroke-dasharray="5 4" stroke-width="1.5"/>
  <path d="M 460 310 Q 570 250 680 190" stroke="#0d9488" stroke-width="3" fill="none"/>
  <text x="570" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#374151">p (0 to 1)</text>
  <text x="400" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#111111">logit(p) = log(p / (1 - p))</text>
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8b5cf6">Multiplying odds adds to log-odds (logistic link)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f1eb"/>
  <rect x="100" y="70" width="600" height="360" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">False Alarm vs Missed Win</text>
  <rect x="160" y="130" width="220" height="110" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="270" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111111">False alarm</text>
  <text x="270" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#111111">Ship bad change</text>
  <rect x="420" y="130" width="220" height="110" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="530" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6b7280">Missed win</text>
  <text x="530" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#6b7280">Kill good change</text>
  <line x1="400" y1="280" x2="400" y2="340" stroke="#9ca3af" stroke-width="2"/>
  <text x="400" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#6b7280">Stricter bar lowers false alarms, raises misses</text>
</svg>

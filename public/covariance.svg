<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Covariance</text>
  <rect x="180" y="100" width="440" height="300" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="2"/>
  <line x1="400" y1="120" x2="400" y2="380" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="200" y1="250" x2="600" y2="250" stroke="#e5e7eb" stroke-width="1.5"/>
  <ellipse cx="400" cy="250" rx="120" ry="60" stroke="#8b5cf6" stroke-width="2.5" fill="none" stroke-dasharray="8 5" transform="rotate(-35 400 250)"/>
  <circle cx="320" cy="290" r="6" fill="#2563eb"/>
  <circle cx="350" cy="270" r="6" fill="#2563eb"/>
  <circle cx="340" cy="310" r="6" fill="#2563eb"/>
  <circle cx="380" cy="240" r="6" fill="#2563eb"/>
  <circle cx="400" cy="260" r="6" fill="#2563eb"/>
  <circle cx="420" cy="230" r="6" fill="#2563eb"/>
  <circle cx="440" cy="250" r="6" fill="#2563eb"/>
  <circle cx="460" cy="220" r="6" fill="#2563eb"/>
  <circle cx="480" cy="240" r="6" fill="#2563eb"/>
  <circle cx="500" cy="210" r="6" fill="#2563eb"/>
  <circle cx="520" cy="230" r="6" fill="#2563eb"/>
  <circle cx="360" cy="200" r="6" fill="#2563eb"/>
  <circle cx="430" cy="280" r="6" fill="#2563eb"/>
  <text x="400" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#374151">Feature X</text>
  <text x="130" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#374151" transform="rotate(-90 130 255)">Feature Y</text>
  <rect x="620" y="140" width="150" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="695" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0d9488">Cov(X,Y)</text>
  <text x="695" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#111111">units mix</text>
  <rect x="620" y="230" width="150" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="695" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ea580c">Corr(X,Y)</text>
  <text x="695" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#111111">-1 to 1</text>
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#111111">Cov(X,Y) = E[(X - mu_x)(Y - mu_y)]</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f5"/>
  <rect x="100" y="70" width="600" height="360" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Regression to the Mean</text>
  <rect x="180" y="280" width="80" height="120" rx="4" fill="#111111"/>
  <rect x="180" y="320" width="80" height="80" rx="4" fill="#d1d5db"/>
  <text x="220" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">Top reps</text>
  <rect x="360" y="300" width="80" height="100" rx="4" fill="#6b7280"/>
  <rect x="360" y="305" width="80" height="95" rx="4" fill="#d1d5db"/>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">Everyone</text>
  <rect x="540" y="340" width="80" height="60" rx="4" fill="#d1d5db"/>
  <rect x="540" y="300" width="80" height="100" rx="4" fill="#111111"/>
  <text x="580" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b7280">Bottom reps</text>
  <text x="220" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111111">Week 1</text>
  <text x="220" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6b7280">Week 2</text>
  <line x1="140" x2="660" y1="200" y2="200" stroke="#9ca3af" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="670" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6b7280">avg</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#6b7280">Extremes move back toward average</text>
</svg>

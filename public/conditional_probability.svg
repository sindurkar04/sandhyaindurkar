<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f5"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Conditional Probability</text>
  <rect x="120" y="100" width="260" height="280" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="420" y="100" width="260" height="280" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="250" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#111">P(A | B)</text>
  <text x="550" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#6b7280">P(B | A)</text>
  <text x="250" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#111">20%</text>
  <text x="550" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#6b7280">83%</text>
  <text x="400" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#6b7280">Same overlap, different denominators</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f1eb"/>
  <rect x="100" y="70" width="600" height="360" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Selection Bias</text>
  <rect x="160" y="260" width="200" height="120" rx="6" fill="#111111"/>
  <text x="260" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">76%</text>
  <text x="260" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111111">Who responded</text>
  <rect x="440" y="260" width="200" height="120" rx="6" fill="#d1d5db" stroke="#111111" stroke-width="2"/>
  <text x="540" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#111111">41%</text>

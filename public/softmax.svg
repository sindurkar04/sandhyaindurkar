<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#111111">Softmax</text>
  <text x="180" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#374151">Raw scores (logits)</text>
  <rect x="90" y="130" width="180" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="163" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">A</text>
  <text x="250" y="163" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111111">2.0</text>
  <rect x="90" y="196" width="180" height="52" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="110" y="229" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0d9488">B</text>
  <text x="250" y="229" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111111">1.0</text>
  <rect x="90" y="262" width="180" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="110" y="295" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ea580c">C</text>
  <text x="250" y="295" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111111">0.5</text>
  <path d="M 300 220 L 380 220 M 380 220 L 362 206 M 380 220 L 362 234" stroke="#111111" stroke-width="3" fill="none"/>
  <text x="340" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111111">softmax</text>
  <text x="600" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#374151">Probabilities (sum = 100%)</text>
  <rect x="420" y="140" width="300" height="30" rx="6" fill="#e5e7eb"/>
  <rect x="420" y="140" width="185" height="30" rx="6" fill="#2563eb"/>
  <text x="735" y="162" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#111111">62%</text>
  <rect x="420" y="206" width="300" height="30" rx="6" fill="#e5e7eb"/>
  <rect x="420" y="206" width="69" height="30" rx="6" fill="#0d9488"/>
  <text x="735" y="228" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#111111">23%</text>
  <rect x="420" y="272" width="300" height="30" rx="6" fill="#e5e7eb"/>
  <rect x="420" y="272" width="45" height="30" rx="6" fill="#ea580c"/>
  <text x="735" y="294" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#111111">15%</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111111">softmax(z)_i = e^(z_i) / &#931;_j e^(z_j)</text>
</svg>
